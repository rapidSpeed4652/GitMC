name: Configure Playit

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Playit
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null

          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" \
            | sudo tee /etc/apt/sources.list.d/playit-cloud.list

          sudo apt update
          sudo apt install -y playit

          echo "Installed Playit:"
          playit --version

      - name: Start Playit
        run: |
          sudo systemctl start playit

          echo "Playit service started."
          sleep 5

          sudo systemctl status playit --no-pager || true

      - name: Generate claim
        run: |
          echo "Generating Playit claim..."
          echo

          playit claim generate > claim_code.txt

          CLAIM_CODE=$(cat claim_code.txt)

          echo "=============================================="
          echo "PLAYIT CLAIM"
          echo "=============================================="
          echo
          echo "Open this URL in your browser:"
          playit claim url "$CLAIM_CODE"
          echo
          echo "Approve the agent in your Playit account."
          echo
          echo "The workflow will remain running while you do this."
          echo "=============================================="

      - name: Wait for claim
        run: |
          CLAIM_CODE=$(cat claim_code.txt)

          echo "Waiting for Playit approval..."
          echo "Do NOT stop this workflow."
          echo

          while true; do
            echo "Checking claim..."

            if SECRET=$(playit claim exchange "$CLAIM_CODE" --wait 10 2>/tmp/playit_claim_error); then
              if [ -n "$SECRET" ]; then
                break
              fi
            fi

            cat /tmp/playit_claim_error || true
            echo "Not approved yet. Waiting 10 seconds..."
            sleep 10
          done

          echo
          echo "=============================================="
          echo "PLAYIT SECRET"
          echo "=============================================="
          echo
          echo "$SECRET"
          echo
          echo "=============================================="
          echo "Copy the secret above."
          echo
          echo "Create a repository secret named:"
          echo "PLAYIT_SECRET"
          echo
          echo "GitHub → Settings → Secrets and variables"
          echo "→ Actions → New repository secret"
          echo "=============================================="

      - name: Keep agent alive briefly
        run: |
          echo "Claim completed."
          echo "Keeping the runner alive for 30 seconds..."
          sleep 30