name: Minecraft Bedrock Server

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  WORLD_RELEASE: bedrock-world-save
  LEVEL_NAME: GitMC World

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ─────────────────────────────────────────────
      # Install dependencies
      # ─────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl tmux

      # ─────────────────────────────────────────────
      # Install Playit
      # ─────────────────────────────────────────────
      - name: Install Playit
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null

          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" \
            | sudo tee /etc/apt/sources.list.d/playit-cloud.list

          sudo apt-get update
          sudo apt-get install -y playit

      # ─────────────────────────────────────────────
      # Configure Playit
      # ─────────────────────────────────────────────
      - name: Configure Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          if [ -z "$PLAYIT_SECRET" ]; then
            echo "ERROR: PLAYIT_SECRET is not configured."
            echo
            echo "Run the Playit Setup workflow first."
            echo "Then add the resulting secret as:"
            echo
            echo "PLAYIT_SECRET"
            exit 1
          fi

          sudo mkdir -p /etc/playit

          printf 'secret_key = "%s"\n' "$PLAYIT_SECRET" \
            | sudo tee /etc/playit/playit.toml >/dev/null

          sudo chmod 600 /etc/playit/playit.toml

          echo "Playit configured."

      # ─────────────────────────────────────────────
      # Download LATEST Bedrock server
      # ─────────────────────────────────────────────
      
      - name: Download latest Bedrock server
        run: |
          mkdir -p server
          cd server

          echo "Fetching official Minecraft Bedrock download page..."

          rm -f download.html

          wget \
            --timeout=30 \
            --tries=5 \
            --waitretry=5 \
            --retry-on-http-error=429,500,502,503,504 \
            --user-agent="Mozilla/5.0" \
            -O download.html \
            "https://www.minecraft.net/en-us/download/server/bedrock"

          echo "Download page fetched successfully."

          echo "Finding Linux Bedrock Dedicated Server URL..."

          DOWNLOAD_URL=$(grep -oE \
            'https://[^"]*bedrock-server-[^"]+\.zip' \
            download.html \
            | grep -i 'bin-linux' \
            | head -n 1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Could not find the Linux Bedrock server download URL."
            echo
            echo "URLs found on the page:"
            grep -oE \
              'https://[^"]+\.zip' \
              download.html \
              | head -20 || true
            exit 1
          fi

          echo
          echo "Found Bedrock server:"
          echo "$DOWNLOAD_URL"
          echo

          echo "Downloading Bedrock Dedicated Server..."

          wget \
            --timeout=30 \
            --tries=5 \
            --waitretry=5 \
            --retry-on-http-error=429,500,502,503,504 \
            --user-agent="Mozilla/5.0" \
            -O bedrock.zip \
            "$DOWNLOAD_URL"

          echo
          echo "Downloaded:"
          ls -lh bedrock.zip

          echo "Extracting..."

          unzip -q bedrock.zip
          rm -f bedrock.zip download.html

          chmod +x bedrock_server

          echo
          echo "Bedrock Dedicated Server installed successfully."
          ls -lh bedrock_server

      # ─────────────────────────────────────────────
      # Configure fixed world name
      # ─────────────────────────────────────────────
      - name: Configure world
        run: |
          cd server

          if grep -q '^level-name=' server.properties; then
            sed -i "s/^level-name=.*/level-name=${LEVEL_NAME}/" server.properties
          else
            echo "level-name=${LEVEL_NAME}" >> server.properties
          fi

          echo "Configured level-name:"
          grep '^level-name=' server.properties

      # ─────────────────────────────────────────────
      # Create Bedrock worlds directory
      # ─────────────────────────────────────────────
      - name: Prepare world directory
        run: |
          mkdir -p "server/worlds/${LEVEL_NAME}"

      # ─────────────────────────────────────────────
      # Restore world
      # ─────────────────────────────────────────────
      - name: Restore world
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/world-save
          mkdir -p /tmp/world-extracted

          echo "Checking for $WORLD_RELEASE release..."

          if gh release view "$WORLD_RELEASE" \
              --repo "${{ github.repository }}" >/dev/null 2>&1; then

            echo "Found Bedrock world release."

            gh release download "$WORLD_RELEASE" \
              --repo "${{ github.repository }}" \
              --pattern "world.zip" \
              --dir /tmp/world-save

            if [ ! -f /tmp/world-save/world.zip ]; then
              echo "No world.zip found in the release."
              echo "A new world will be generated."
              exit 0
            fi

            echo "Extracting saved world..."

            unzip -q /tmp/world-save/world.zip \
              -d /tmp/world-extracted

            # The ZIP contains:
            #
            # world/
            #   level.dat
            #   db/
            #   ...
            #
            # Copy its CONTENTS into:
            #
            # server/worlds/GitMC World/

            if [ -d "/tmp/world-extracted/world" ]; then

              rm -rf "server/worlds/${LEVEL_NAME}"

              mkdir -p "server/worlds/${LEVEL_NAME}"

              cp -a \
                /tmp/world-extracted/world/. \
                "server/worlds/${LEVEL_NAME}/"

              echo "World restored successfully."

            else
              echo "ERROR: world.zip does not contain a world/ directory."
              echo
              echo "Archive contents:"
              find /tmp/world-extracted -maxdepth 3 -type f | head -50
              exit 1
            fi

          else
            echo "No $WORLD_RELEASE release exists."
            echo "A new world will be generated."
          fi

      # ─────────────────────────────────────────────
      # Start Bedrock server
      # ─────────────────────────────────────────────
      - name: Start Bedrock server
        run: |
          cd server

          echo "Starting Bedrock Dedicated Server..."

          tmux new-session -d -s minecraft \
            "LD_LIBRARY_PATH=. ./bedrock_server 2>&1 | tee server.log"

          echo "Waiting for server to start..."

          for i in {1..60}; do

            if grep -q "Server started" server.log 2>/dev/null; then
              echo "Bedrock server started!"
              break
            fi

            if ! tmux has-session -t minecraft 2>/dev/null; then
              echo "ERROR: Bedrock server stopped."
              echo
              cat server.log 2>/dev/null || true
              exit 1
            fi

            sleep 2
          done

          if ! tmux has-session -t minecraft 2>/dev/null; then
            echo "ERROR: Bedrock server is not running."
            cat server.log 2>/dev/null || true
            exit 1
          fi

      # ─────────────────────────────────────────────
      # Start Playit
      # ─────────────────────────────────────────────
      - name: Start Playit
        run: |
          echo "Starting Playit..."

          sudo systemctl stop playit 2>/dev/null || true

          sudo /opt/playit/playitd \
            --secret-path /etc/playit/playit.toml \
            > /tmp/playit.log 2>&1 &

          PLAYIT_PID=$!

          echo "$PLAYIT_PID" > /tmp/playit.pid

          sleep 10

          echo
          echo "========== PLAYIT =========="
          cat /tmp/playit.log
          echo "============================"
          echo

      # ─────────────────────────────────────────────
      # Run server
      # ─────────────────────────────────────────────
      - name: Run server
        run: |
          echo
          echo "=============================================="
          echo "Minecraft Bedrock server is running!"
          echo "=============================================="
          echo
          echo "World:"
          echo "$LEVEL_NAME"
          echo
          echo "Local Bedrock port:"
          echo "UDP 19132"
          echo
          echo "=============================================="

          while tmux has-session -t minecraft 2>/dev/null; do
            sleep 15

            echo
            echo "----- Bedrock server log -----"
            tail -n 10 server/server.log 2>/dev/null || true
          done

          echo "Minecraft server stopped."

      # ─────────────────────────────────────────────
      # Stop Minecraft
      # ─────────────────────────────────────────────
      - name: Stop Minecraft
        if: always()
        run: |
          if tmux has-session -t minecraft 2>/dev/null; then

            echo "Stopping Minecraft..."

            tmux send-keys -t minecraft "stop" Enter

            for i in {1..30}; do

              if ! tmux has-session -t minecraft 2>/dev/null; then
                break
              fi

              sleep 2

            done

            if tmux has-session -t minecraft 2>/dev/null; then
              echo "Server did not stop normally."
              tmux kill-session -t minecraft
            fi

          fi

      # ─────────────────────────────────────────────
      # Stop Playit
      # ─────────────────────────────────────────────
      - name: Stop Playit
        if: always()
        run: |
          if [ -f /tmp/playit.pid ]; then
            kill "$(cat /tmp/playit.pid)" 2>/dev/null || true
          fi

          sudo systemctl stop playit 2>/dev/null || true

      # ─────────────────────────────────────────────
      # Save world
      # ─────────────────────────────────────────────
      - name: Save world
        if: always()
        run: |
          WORLD_PATH="server/worlds/${LEVEL_NAME}"

          if [ ! -d "$WORLD_PATH" ]; then
            echo "ERROR: World directory does not exist:"
            echo "$WORLD_PATH"
            exit 1
          fi

          echo "Saving Bedrock world..."

          rm -rf /tmp/world-package
          mkdir -p /tmp/world-package

          cp -a "$WORLD_PATH" /tmp/world-package/world

          cd /tmp/world-package

          zip -qr /tmp/world.zip world

          echo
          echo "World archive created:"
          ls -lh /tmp/world.zip

          echo "Archive contents:"
          unzip -l /tmp/world.zip | head -30

      # ─────────────────────────────────────────────
      # Upload world to Bedrock Release
      # ─────────────────────────────────────────────
      - name: Upload Bedrock world save
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/world.zip ]; then
            echo "No world.zip found."
            exit 0
          fi

          if ! gh release view "$WORLD_RELEASE" \
              --repo "${{ github.repository }}" >/dev/null 2>&1; then

            echo "Creating Bedrock world release..."

            gh release create "$WORLD_RELEASE" \
              --repo "${{ github.repository }}" \
              --title "Minecraft Bedrock World Save" \
              --notes "Automatically updated Minecraft Bedrock world save." \
              --target "${{ github.sha }}"

          fi

          echo "Uploading Bedrock world..."

          gh release upload "$WORLD_RELEASE" \
            /tmp/world.zip \
            --repo "${{ github.repository }}" \
            --clobber

          echo
          echo "=============================================="
          echo "Bedrock world saved successfully!"
          echo "Release: $WORLD_RELEASE"
          echo "=============================================="