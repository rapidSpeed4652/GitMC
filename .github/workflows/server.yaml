name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Paper 26.2
        run: |
          mkdir -p server
          DOWNLOAD_URL=$(curl -s -H "User-Agent: minecraft-server/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds" | \
            jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url)')
          echo "Downloading: $DOWNLOAD_URL"
          wget -O server/paper.jar "$DOWNLOAD_URL"
          ls -la server/

      - name: Install bore
        run: |
          wget -O bore.tar.gz \
            "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf bore.tar.gz
          chmod +x bore
          ./bore --version  

      - name: Restore previous world
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for previous world save..."

          mkdir -p /tmp/world-save

          if gh release download world-save \
              --repo "${{ github.repository }}" \
              --pattern "world.zip" \
              --dir /tmp/world-save; then

            echo "Previous world found."

            rm -rf world

            unzip -q /tmp/world-save/world.zip

            if [ -d "world/world" ]; then
              mv world/world/* world/ 2>/dev/null || true
              mv world/world/.* world/ 2>/dev/null || true
              rmdir world/world 2>/dev/null || true
            fi

            echo "World restored successfully."

          else
            echo "No previous world save found."
            echo "A new world will be created."
          fi

      - name: Start Minecraft server
        working-directory: server
        run: |
          echo "eula=true" > eula.txt
          java -Xms1G -Xmx4G \
            -jar paper.jar nogui \
            > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Minecraft server
        working-directory: server
        run: |
          for i in {1..120}; do
            if grep -q "Done (" server.log; then
              echo "Minecraft server is ready!"
              break
            fi
            # Check if the process died
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "Server process died!"
              cat server.log
              exit 1
            fi
            sleep 2
          done

          if ! grep -q "Done (" server.log; then
            echo "Minecraft server failed to start (timeout)."
            cat server.log
            exit 1
          fi   

      - name: Start bore tunnel
        run: |
          ./bore local 25565 --to bore.pub > bore.log 2>&1 &
          echo $! > bore.pid

          for i in {1..30}; do
            ADDR=$(grep -oP 'bore\.pub:\K[0-9]+' bore.log | head -n1 || true)
            if [ -n "$ADDR" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$ADDR" ]; then
            echo "Bore tunnel failed to start."
            cat bore.log
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       MINECRAFT SERVER ADDRESS"
          echo "=========================================="
          echo ""
          echo "bore.pub:${ADDR}"
          echo ""
          echo "=========================================="

      - name: Run server
        run: |
          echo "Minecraft server is now running."
          echo "Press 'Cancel workflow' to stop it."

          while true; do

            if ! tmux has-session -t minecraft 2>/dev/null; then
              echo "Minecraft server stopped unexpectedly."
              exit 1
            fi

            echo "[$(date '+%H:%M:%S')] Server running..."

            sleep 30

          done

      - name: Stop Minecraft server
        if: always()
        run: |
          echo "Stopping Minecraft server..."

          if tmux has-session -t minecraft 2>/dev/null; then

            echo "Sending stop command..."
            tmux send-keys -t minecraft "stop" Enter

            echo "Waiting for Minecraft to save the world..."
            sleep 20

            if tmux has-session -t minecraft 2>/dev/null; then
              echo "Minecraft did not exit normally."
              tmux kill-session -t minecraft || true
            else
              echo "Minecraft shut down cleanly."
            fi

          else
            echo "Minecraft process is already stopped."
          fi

      - name: Create world backup
        if: always()
        run: |
          if [ ! -d "world" ]; then
            echo "No world directory found."
            exit 0
          fi

          echo "Creating world backup..."

          rm -f /tmp/world.zip

          zip -r -q /tmp/world.zip world

          echo
          echo "World backup created:"
          ls -lh /tmp/world.zip

      - name: Upload world backup
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/world.zip ]; then
            echo "No world backup to upload."
            exit 0
          fi

          echo "Uploading world..."

          gh release upload world-save \
            /tmp/world.zip \
            --repo "${{ github.repository }}" \
            --clobber

          echo "World save uploaded successfully."
