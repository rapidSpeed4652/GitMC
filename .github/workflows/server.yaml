name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Paper 26.2
        run: |
          mkdir -p server
          DOWNLOAD_URL=$(curl -s -H "User-Agent: minecraft-server/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds" | \
            jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url)')
          echo "Downloading: $DOWNLOAD_URL"
          wget -O server/paper.jar "$DOWNLOAD_URL"
          ls -la server/

      - name: Install bore
        run: |
          wget -O bore.tar.gz \
            "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf bore.tar.gz
          chmod +x bore
          ./bore --version   

      - name: Start Minecraft server
        working-directory: server
        run: |
          echo "eula=true" > eula.txt
          java -Xms1G -Xmx4G \
            -jar paper.jar nogui \
            > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Minecraft server
        working-directory: server
        run: |
          for i in {1..120}; do
            if grep -q "Done (" server.log; then
              echo "Minecraft server is ready!"
              break
            fi
            # Check if the process died
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "Server process died!"
              cat server.log
              exit 1
            fi
            sleep 2
          done

          if ! grep -q "Done (" server.log; then
            echo "Minecraft server failed to start (timeout)."
            cat server.log
            exit 1
          fi   

      - name: Start bore tunnel
        run: |
          ./bore local 25565 --to bore.pub > bore.log 2>&1 &
          echo $! > bore.pid

          for i in {1..30}; do
            ADDR=$(grep -oP 'bore\.pub:\K[0-9]+' bore.log | head -n1 || true)
            if [ -n "$ADDR" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$ADDR" ]; then
            echo "Bore tunnel failed to start."
            cat bore.log
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       MINECRAFT SERVER ADDRESS"
          echo "=========================================="
          echo ""
          echo "bore.pub:${ADDR}"
          echo ""
          echo "=========================================="

      - name: Monitor server
        working-directory: server
        run: |
          while kill -0 $(cat server.pid) 2>/dev/null; do
            sleep 30
          done
          echo "Minecraft server stopped."   
