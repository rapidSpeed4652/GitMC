name: Minecraft Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ─────────────────────────────────────────────
      # Install Java
      # ─────────────────────────────────────────────
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # ─────────────────────────────────────────────
      # Install tmux
      # ─────────────────────────────────────────────
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      # ─────────────────────────────────────────────
      # Download Paper
      # ─────────────────────────────────────────────
      - name: Download Paper 26.2
        run: |
          mkdir -p server

          DOWNLOAD_URL=$(curl -s \
            -H "User-Agent: minecraft-server/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds" |
            jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url)')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not find a stable Paper 26.2 build."
            exit 1
          fi

          echo "Downloading: $DOWNLOAD_URL"

          wget -O server/paper.jar "$DOWNLOAD_URL"

          echo "Paper downloaded:"
          ls -lh server/paper.jar

      # ─────────────────────────────────────────────
      # Install bore
      # ─────────────────────────────────────────────
      - name: Install bore
        run: |
          wget -O bore.tar.gz \
            "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz"

          tar xzf bore.tar.gz
          chmod +x bore

          ./bore --version

      # ─────────────────────────────────────────────
      # Restore world
      # ─────────────────────────────────────────────
      - name: Restore previous world
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for previous world save..."

          mkdir -p /tmp/world-save

          if gh release download world-save \
              --repo "${{ github.repository }}" \
              --pattern "world.zip" \
              --dir /tmp/world-save; then

            echo "Previous world found."

            rm -rf server/world

            mkdir -p /tmp/world-save/extracted

            unzip -q \
              /tmp/world-save/world.zip \
              -d /tmp/world-save/extracted

            if [ -d "/tmp/world-save/extracted/world" ]; then

              mv \
                /tmp/world-save/extracted/world \
                server/world

            elif [ -d "/tmp/world-save/extracted/server/world" ]; then

              mv \
                /tmp/world-save/extracted/server/world \
                server/world

            else

              echo "ERROR: No world directory found in world.zip."

              echo "Contents of backup:"
              find /tmp/world-save/extracted -maxdepth 3 -print

              exit 1
            fi

            echo "World restored successfully."

            ls -la server/world

          else

            echo "No previous world save found."
            echo "Minecraft will create a new world."

          fi

      # ─────────────────────────────────────────────
      # Start Minecraft
      # ─────────────────────────────────────────────
      - name: Start Minecraft server
        working-directory: server
        run: |
          echo "eula=true" > eula.txt

          echo "Starting Minecraft server..."

          tmux new-session -d \
            -s minecraft \
            "java -Xms1G -Xmx4G -jar paper.jar nogui 2>&1 | tee server.log"

          sleep 2

          if ! tmux has-session -t minecraft 2>/dev/null; then
            echo "Minecraft failed to start."

            if [ -f server.log ]; then
              echo ""
              echo "===== SERVER LOG ====="
              cat server.log
            fi

            exit 1
          fi

          echo "Minecraft process started."

      # ─────────────────────────────────────────────
      # Wait for Minecraft
      # ─────────────────────────────────────────────
      - name: Wait for Minecraft server
        working-directory: server
        run: |
          echo "Waiting for Minecraft to finish starting..."

          for i in {1..120}; do

            if grep -q "Done (" server.log 2>/dev/null; then
              echo ""
              echo "Minecraft server is ready!"
              exit 0
            fi

            if ! tmux has-session -t minecraft 2>/dev/null; then

              echo ""
              echo "Minecraft server stopped during startup."
              echo ""
              echo "===== SERVER LOG ====="

              if [ -f server.log ]; then
                cat server.log
              else
                echo "server.log does not exist."
              fi

              exit 1
            fi

            sleep 2

          done

          echo ""
          echo "Minecraft failed to start within 4 minutes."
          echo ""
          echo "===== SERVER LOG ====="
          cat server.log

          exit 1

      # ─────────────────────────────────────────────
      # Start bore tunnel
      # ─────────────────────────────────────────────
      - name: Start bore tunnel
        run: |
          ./bore local 25565 --to bore.pub \
            > bore.log 2>&1 &

          echo $! > bore.pid

          echo "Waiting for bore tunnel..."

          for i in {1..30}; do

            ADDR=$(grep -oP 'bore\.pub:\K[0-9]+' bore.log |
              head -n1 || true)

            if [ -n "$ADDR" ]; then
              break
            fi

            sleep 2

          done

          if [ -z "$ADDR" ]; then
            echo "Bore tunnel failed to start."
            echo ""
            echo "===== BORE LOG ====="
            cat bore.log
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       MINECRAFT SERVER ADDRESS"
          echo "=========================================="
          echo ""
          echo "bore.pub:$ADDR"
          echo ""
          echo "=========================================="

      # ─────────────────────────────────────────────
      # Keep workflow alive
      # ─────────────────────────────────────────────
      - name: Run server
        run: |
          echo "Minecraft server is now running."
          echo "Press 'Cancel workflow' to stop it."

          while true; do

            if ! tmux has-session -t minecraft 2>/dev/null; then

              echo ""
              echo "Minecraft server stopped unexpectedly."

              if [ -f server/server.log ]; then
                echo ""
                echo "===== SERVER LOG ====="
                tail -n 100 server/server.log
              fi

              exit 1
            fi

            echo "[$(date '+%H:%M:%S')] Server running..."

            sleep 30

          done

      # ─────────────────────────────────────────────
      # Stop Minecraft
      # ─────────────────────────────────────────────
      - name: Stop Minecraft server
        if: always()
        run: |
          echo "Stopping Minecraft server..."

          if tmux has-session -t minecraft 2>/dev/null; then

            echo "Sending stop command..."

            tmux send-keys \
              -t minecraft \
              "stop" \
              Enter

            echo "Waiting for Minecraft to save the world..."

            for i in {1..30}; do

              if ! tmux has-session -t minecraft 2>/dev/null; then
                echo "Minecraft shut down cleanly."
                break
              fi

              sleep 2

            done

            if tmux has-session -t minecraft 2>/dev/null; then

              echo "Minecraft did not stop after 60 seconds."
              echo "Force stopping tmux session..."

              tmux kill-session -t minecraft || true

            fi

          else

            echo "Minecraft session is already stopped."

          fi

      # ─────────────────────────────────────────────
      # Stop bore
      # ─────────────────────────────────────────────
      - name: Stop bore
        if: always()
        run: |
          if [ -f bore.pid ]; then

            PID=$(cat bore.pid)

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping bore..."
              kill "$PID" 2>/dev/null || true
            fi

          fi

      # ─────────────────────────────────────────────
      # Create world backup
      # ─────────────────────────────────────────────
      - name: Create world backup
        if: always()
        run: |
          if [ ! -d "server/world" ]; then
            echo "No world directory found."
            exit 0
          fi

          echo "Creating world backup..."

          rm -f /tmp/world.zip

          cd server

          zip -r -q /tmp/world.zip world

          cd ..

          echo ""
          echo "World backup created:"
          ls -lh /tmp/world.zip

      # ─────────────────────────────────────────────
      # Upload world backup
      # ─────────────────────────────────────────────
      - name: Upload world backup
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/world.zip ]; then
            echo "No world backup to upload."
            exit 0
          fi

          echo "World backup found:"
          ls -lh /tmp/world.zip

          echo "Checking for world-save release..."

          if gh release view world-save \
              --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then

            echo "world-save release already exists."

          else

            echo "world-save release does not exist."
            echo "Creating it..."

            gh release create world-save \
              --repo "${{ github.repository }}" \
              --title "Minecraft World Save" \
              --notes "Automatically updated Minecraft world save." \
              --target "${{ github.sha }}"

          fi

          echo "Uploading world.zip..."

          gh release upload world-save \
            /tmp/world.zip \
            --repo "${{ github.repository }}" \
            --clobber

          echo ""
          echo "=========================================="
          echo "       WORLD SAVE UPLOADED"
          echo "=========================================="
          echo ""
          echo "world.zip successfully uploaded."